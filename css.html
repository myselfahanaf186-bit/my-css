<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first css</title>
   <style>
    
   p{
        color: red;
    }
    
    .intermediate{
       color: blue; 
    }
    
    #oneEightSix{
        color:rgb(60, 162, 239)
    }

    /* global selector */

   *{
    color: rgb(234, 234, 54);
   }
    

   </style>
</head>
<body>
   <!-- inline css -->
    <p style="color:orchid">this is a simple paragraph</p>
    <p style="color: aquamarine;">this is a simple paragraph</p>

    <!-- internal css with tag selector -->
     <p>this is a simple paragraph</p>
    
    <!-- internal with class selector -->
    <p class="intermediate">this is a simple paragraph</p>
    <p class="intermediate">this is a simple paragraph</p>
    
    <!-- internal css with id selector -->
     <p id="oneEightSix">this is a simple paragraph</p>

     
   
</body>
</html>
